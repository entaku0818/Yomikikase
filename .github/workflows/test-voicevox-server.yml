name: Test VOICEVOX server

on:
  push:
    branches: [ main ]
    paths:
      - 'voicevox-server/**'
      - '.github/workflows/test-voicevox-server.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'voicevox-server/**'
      - '.github/workflows/test-voicevox-server.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./voicevox-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: voicevox-server/go.mod
          cache-dependency-path: voicevox-server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
